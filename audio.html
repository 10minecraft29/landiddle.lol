<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recovered Audio — Landiddle</title><link rel="stylesheet" href="/style.css"></head><body class="scanlines"><div class="noise"></div><div class="container"><nav class="nav"><a class="brand" href="/caseboard"><div class="brand-mark">◉</div><div>LANDIDDLE<small>AUDIO EVIDENCE</small></div></a><div class="navlinks"><a href="/caseboard">Caseboard</a><a href="/cameras">Cameras</a></div></nav></div><main><section class="page-head"><div class="container"><div class="eyebrow">RECOVERED RECORDINGS // SYNTHESIZED PLAYBACK</div><h1>AUDIO LOGS</h1><p>Recovered transcripts are played through the browser's speech engine with generated static. No microphone or device audio is accessed.</p></div></section><section><div class="container"><div class="audio-grid" id="audioGrid"></div></div></section></main><script src="/site.js"></script><script>
const logs=[['security','C03 Security Dispatch','2024-07-14 02:14:01','Sector C dispatch immediately before the missing seven minutes.'],['engineer','Bonztel Engineer Voicemail','2003-07-15 09:22:40','Engineer discusses an E0 signal that remains after shutdown.'],['evac','Facility Evacuation Message','DATE CORRUPTED','Automated warning not present in the official incident report.'],['server','SERVER03 Voice Fragment','NO AUDIO SOURCE','Transcript is stored as audio even though SERVER03 has no sound hardware.'],['000','000.wav','1999? / 2026?','File has no creation event and changes metadata after playback.']];const root=document.querySelector('#audioGrid');logs.forEach(([id,title,date,desc],n)=>{const el=document.createElement('article');el.className='audio-card';let bars='';for(let i=0;i<46;i++)bars+=`<i style="--h:${((i*7+n*11)%15)+1}"></i>`;el.innerHTML=`<div class="eyebrow">AUDIO-${String(n+1).padStart(2,'0')} // ${date}</div><h2>${title}</h2><p class="small-muted">${desc}</p><div class="waveform">${bars}</div><button class="btn" data-audio="${id}">▶ PLAY RECOVERED LOG</button>`;root.appendChild(el)});document.querySelectorAll('[data-audio]').forEach(b=>b.onclick=()=>{LandiddleAudio.play(b.dataset.audio);if(b.dataset.audio==='000')LandiddleState.action('heard-000wav')});
</script></body></html>
