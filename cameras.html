<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Cameras — Landiddle</title><link rel="stylesheet" href="/style.css"></head><body class="scanlines"><div class="noise"></div><div class="container"><nav class="nav"><a class="brand" href="/"><div class="brand-mark">C</div><div>LANDIDDLE<small>SECURITY VIDEO MATRIX</small></div></a><div class="navlinks"><a href="/classified">Archive</a><a href="/facility-map">Facility map</a><a href="/audio">Audio</a></div><span class="badge danger-badge">LIVE MIRROR?</span></nav></div><main><section class="page-head"><div class="container"><div class="eyebrow">CAM-01 — CAM-12 // SESSION <span data-session></span></div><h1>CAMERAS</h1><p>Most feeds are uneventful. CAM-C03 is listed as destroyed on 2024-03-22 but continues to produce frames dated after disposal.</p></div></section><section><div class="container"><div class="camera-grid" id="grid"></div><div class="board-detail" id="camDetail">Select a feed to inspect metadata.</div></div></section></main><script src="/site.js"></script><script>
const s=LandiddleState.read(),glitchCam=((s.seed%9)+1);const defs=Array.from({length:12},(_,i)=>{const n=i+1;return{id:`CAM-${String(n).padStart(2,'0')}`,label:n===3?'CAM-C03':`CAM-${String(n).padStart(2,'0')}`,zone:n===3?'ARCHIVE CORRIDOR':n===9?'SUBLEVEL LIFT':n===12?'ROOM ███':'SECTOR '+String.fromCharCode(65+(n%4)),offline:[5,10].includes(n),anomaly:n===3||n===glitchCam}});const root=document.querySelector('#grid'),detail=document.querySelector('#camDetail');defs.forEach((d,i)=>{const el=document.createElement('article');el.className='camera-card '+(d.offline?'offline ':'')+(d.anomaly?'anomaly glitch':'');el.innerHTML=`<div class="camera-feed"><i class="cam-hall"></i><i class="cam-door"></i><i class="cam-figure"></i></div><div class="camera-meta"><span>${d.label}</span><span>${d.zone}</span></div>`;el.onclick=()=>{LandiddleState.camera(d.id);if(d.id==='CAM-03'){LandiddleState.clue('camera-c03');landiddleAward('camera');detail.innerHTML='<b>CAM-C03 // SERIAL C03-000</b><p>Disposal record: 2024-03-22. Recovered frame: 2024-07-14 02:14:01. Face detection: NO FACE PRESENT. Badge event same millisecond: 000 / ACCESS GRANTED.</p><a class="btn" href="/incident-714">OPEN RAW ATTACHMENT</a>'}else if(i+1===glitchCam){detail.innerHTML=`<b>${d.id} // SESSION-SPECIFIC ANOMALY</b><p>This feed was selected by session seed ${s.seed}. It contains a 117 ms image not present on reload in other sessions.</p>`}else detail.innerHTML=`<b>${d.id}</b><p>${d.zone}. ${d.offline?'No signal.':'No canonical incident markers.'}</p>`};root.appendChild(el)});
function flash(){const c=[...document.querySelectorAll('.camera-card.anomaly .cam-figure')];if(!c.length)return;const f=c[Math.floor(Math.random()*c.length)];f.classList.add('flash');setTimeout(()=>f.classList.remove('flash'),120);setTimeout(flash,5000+(s.seed%6000))}setTimeout(flash,1800);
</script></body></html>
