<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Landiddle Internal Browser — History</title><link rel="stylesheet" href="/style.css"></head><body class="scanlines"><div class="container"><nav class="nav"><a class="brand" href="/"><div class="brand-mark">L</div><div>LANDIDDLE<small>INTERNAL BROWSER</small></div></a><div class="navlinks"><a href="/classified">Archive</a><a href="/timeline">Timeline</a></div></nav></div><main><section class="page-head"><div class="container"><div class="eyebrow">INTERNAL WEBVIEW // LOCAL MIRROR HISTORY</div><h1>BROWSER HISTORY</h1><p>This is an in-universe history database. It does not read your real browser history.</p></div></section><section><div class="container"><div class="browser-shell"><div class="browser-tabs"><div class="browser-tab">History — Landiddle WebView</div></div><div class="browser-bar"><div class="browser-pill">landiddle://history/session/<span data-session></span></div></div><div class="history-list" id="historyList"></div></div></div></section></main><script src="/site.js"></script><script>
const s=LandiddleState.read(),root=document.querySelector('#historyList'),created=new Date(s.created);const rows=[...s.history].sort((a,b)=>new Date(b.at)-new Date(a.at));rows.forEach(h=>{const d=new Date(h.at),future=d>new Date(Date.now()+3600000),el=document.createElement('div');el.className='history-row '+(h.synthetic?'synthetic ':'')+(future?'future':'');el.innerHTML=`<code>${d.toISOString()}</code><div><b>${h.title||h.path}</b><br><code>${h.path}</code></div><span class="history-label">${future?'FUTURE ENTRY':h.synthetic?'PRE-SESSION':'LOCAL'}</span>`;if(future)el.onclick=()=>{LandiddleState.clue('future-history');landiddleToast('HISTORY ENTRY TIMESTAMP EXCEEDS SESSION CLOCK','anomaly')};root.appendChild(el)});if(rows.some(h=>new Date(h.at)>new Date(Date.now()+3600000)))document.body.dataset.hasFuture='1';
</script></body></html>
