<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timeline — Landoodle Files</title><link rel="stylesheet" href="/style.css"></head><body class="scanlines"><div class="noise"></div><div class="container"><nav class="nav"><a class="brand" href="/"><div class="brand-mark">L</div><div>LANDIDDLE<small>TEMPORAL ANALYSIS</small></div></a><div class="navlinks"><a href="/classified">Archive</a><a href="/caseboard">Caseboard</a><a href="/history">Browser history</a></div><span class="phase-chip">PHASE <span data-phase></span></span></nav></div><main><section class="page-head"><div class="container"><div class="eyebrow">CORRELATED EVENT INDEX // DATES NOT AUTHORITATIVE</div><h1>TIMELINE</h1><p>Events are assembled from documents the current session has discovered. Conflicting timestamps are preserved instead of reconciled.</p></div></section><section><div class="container"><div class="timeline" id="timeline"></div></div></section></main><script src="/site.js"></script><script>
const s=LandiddleState.read();const events=[
{date:'1999-03-12',title:'“LANDOODLE” appears in annex ledger',text:'Signed with employee identifier 000. Facility construction had not begun.',need:()=>s.opened.includes('LF-001'),tag:'DATE VERIFIED'},
{date:'2001-07-14',title:'Memo references “Server Three”',text:'Recovered shadow metadata refers to Server Three three years before SERVER03 installation records.',need:()=>s.opened.includes('LF-012')||s.unlocked.includes('shadow-index'),tag:'SOURCE CONFLICT',bad:1},
{date:'2003-07-15',title:'Bonztel engineer references “the 7/14 behavior”',text:'Email asks whether the 7/14 behavior can be reproduced on E0. Government and archive dates are later.',need:()=>s.actions.includes('mail:2003-714')||s.opened.includes('LF-004'),tag:'SOURCE CONFLICT',bad:1},
{date:'2004-02-03',title:'SERVER03 installation',text:'Infrastructure inventory claims first installation on this date.',need:()=>s.opened.includes('LF-002')||s.visited.includes('/basement'),tag:'DATE DISPUTED'},
{date:'2008-07-14',title:'Government 7/14 systems interruption',text:'Department retention copy places a seven-minute interruption in 2008.',need:()=>s.clues.includes('gov-2008')||s.opened.includes('LF-004'),tag:'DATE DISPUTED',bad:1},
{date:'2017-11-03',title:'Credential 03-000 issued and revoked',text:'Issuer, approver, and photo-removal requester are all 000.',need:()=>s.opened.includes('LF-006')||s.actions.includes('secret-employee000'),tag:'PERSONNEL RECORD'},
{date:'2019-06-22',title:'Landiddle gateway cache exists before deployment',text:'Cold-storage image contains the public gateway and SERVER03 headers.',need:()=>s.opened.includes('LF-005'),tag:'EVENT MAY NOT HAVE OCCURRED',ghost:1},
{date:'2022-04-09',title:'BONZI-0 sample transferred',text:'Bonztel sample serial 000000 moved to Infrastructure Research without a receiving signature.',need:()=>s.opened.includes('LF-003')||s.visited.includes('/bonzi'),tag:'PROCUREMENT'},
{date:'2024-07-14',title:'Canonical Incident 7/14',text:'Seven missing minutes. Badge 000 authenticates. CAM-C03 captures a figure after the camera was supposedly destroyed.',need:()=>s.opened.includes('LF-004')||s.cameraViews.includes('CAM-03'),tag:'CANONICAL? ',bad:1},
{date:'2025-02-03',title:'Basement corridor opened',text:'SERVER03 remains network-active after both power feeds are isolated.',need:()=>s.opened.includes('LF-002')||s.visited.includes('/basement'),tag:'INFRASTRUCTURE'},
{date:'2026-08-18',title:'Archive mirror session created',text:`Current session ${s.session} attached to observer slot.`,need:()=>true,tag:'CURRENT SESSION'},
{date:'+7 DAYS',title:'Project LANDOODLE appears in browser history',text:'A history entry may exist with a timestamp later than the current session.',need:()=>s.clues.includes('future-history')||s.visited.includes('/history'),tag:'EVENT MAY NOT HAVE OCCURRED',ghost:1}
];const root=document.querySelector('#timeline');events.filter(e=>e.need()).forEach(e=>{const el=document.createElement('div');el.className='time-event';el.innerHTML=`<div class="time-date">${e.date}</div><div class="time-card"><h3>${e.title}</h3><p>${e.text}</p><span class="timeline-tag ${e.bad?'bad':e.ghost?'ghost':''}">${e.tag}</span></div>`;root.appendChild(el)});if(!root.children.length)root.innerHTML='<p class="small-muted">Open archive records to populate the correlated timeline.</p>';
</script></body></html>
