const t=document.querySelector('#term'),c=document.querySelector('#cmd');function p(x=''){t.textContent+='\n'+x;t.scrollTop=t.scrollHeight}bootText(t,['LANDIDDLE ARCHIVE CONSOLE 7.1','session '+LandiddleState.read().session,'maintenance commands available','type help'],7);function run(q){const [cmd,...rest]=q.trim().split(/\s+/),arg=rest.join(' ');p(`archive@mirror-a:~$ ${q}`);switch((cmd||'').toLowerCase()){case'help':p('open <file> | search <term> | recover <block> | trace server03 | whois landoodle | phase | achievements | history | clear');break;case'open':if(/^lf-?\d+/i.test(arg))location.href='/classified?file='+arg.toUpperCase().replace(/^LF(\d)/,'LF-$1');else p('file id required');break;case'search':LandiddleState.search(arg);if(/employee_?000|e0|process/i.test(arg))p('shadow hit: LF-012 // owner E000 // type PROCESS');else if(/server03/i.test(arg))p('hits: LF-002, LF-008, SERVER03 service page');else p('0 canonical hits; query retained by mirror');break;case'recover':if(arg==='0x17A9'){LandiddleState.recovery(arg);LandiddleState.unlock('containment-protocol');p('block 0x17A9 attached // containment procedure available')}else p('recovery requires block address from Mirror B');break;case'trace':if(arg.toLowerCase()==='server03'){LandiddleState.clue('server03-trace');LandiddleState.phase(2);LandiddleState.action('server03-traced');landiddleAward('server');p('hop 1 mirror-a\nhop 2 10.0.0.3\nhop 3 mirror-a\nTRACE LOOP DETECTED\nowner E000')}else p('unknown trace target');break;case'whois':if(arg.toLowerCase()==='landoodle')p('object type: process / archive / project\ncreated: [no creation event]\nowner: 000\nregistrant: current observer?');else p('no record');break;case'phase':p('PHASE '+LandiddleState.read().phase+' // integrity '+LandiddleState.integrity()+'%');break;case'achievements':p(LandiddleState.read().achievements.join('\n')||'none recorded');break;case'history':location.href='/history';break;case'clear':t.textContent='';break;case'purge':if(arg.toUpperCase()==='SESSION'){p('PURGE REQUEST STAGED. TYPE: PURGE SESSION CONFIRM')}else if(arg.toUpperCase()==='SESSION CONFIRM'){localStorage.removeItem('landiddle-state-v3');localStorage.removeItem('landiddle-progress-v2');p('SESSION PURGED. MIRROR RESTARTING…');setTimeout(()=>location.href='/',700)}else p('target not recognized');break;case'identify':if(arg==='000'){const s=LandiddleState.read();if(s.login.id==='000'&&s.actions.includes('secret-employee000')&&(s.opened.includes('LF-012')||s.unlocked.includes('shadow-index'))){LandiddleState.action('employee000-identified');p('identity resolution succeeded and failed simultaneously. ending route authorized: /ending?type=employee000')}else p('insufficient contradictory identity records')}else p('subject not found');break;default:p('command not found')}}c.onkeydown=e=>{if(e.key!=='Enter')return;const q=c.value;c.value='';run(q)};
