<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deleted Record Recovery — Mirror B</title><link rel="stylesheet" href="/style.css"></head><body class="scanlines secret-black"><div class="noise"></div><div class="container"><nav class="nav"><a class="brand" href="/classified"><div class="brand-mark">B</div><div>MIRROR B<small>DELETED RECORD RECOVERY</small></div></a><div class="navlinks"><a href="/classified">Mirror A</a><a href="/console">Console</a></div><span class="badge danger-badge">NOT INDEXED</span></nav></div><main><section class="page-head"><div class="container"><div class="eyebrow">FORENSIC RECOVERY // DELETION JOURNAL</div><h1>DELETED FILES</h1><p>Deletion jobs are retained as documents. Some fragments can be restored into the current session.</p></div></section><section><div class="container"><div class="recovery-console"><div class="recovery-list"><button class="btn primary" id="scan" style="width:100%;justify-content:center;margin-bottom:12px">SCAN MIRROR B</button><div id="items"><p class="small-muted">No scan results.</p></div></div><div class="recovery-view"><div class="eyebrow" id="fragLabel">RECOVERY VIEW</div><div class="fragment-view" id="fragment">Select SCAN to inspect deleted blocks.</div><div class="recovery-actions"><button class="btn" id="view" disabled>VIEW FRAGMENT</button><button class="btn primary" id="restore" disabled>RESTORE</button></div></div></div></div></section></main><script src="/site.js"></script><script>
const blocks=[{id:'0x17A9',pct:64,title:'Containment Procedure Draft',text:'[64% RECOVERED]\n\nPROCEDURE: isolate SERVER03 network interface, disable BONZI-0 E0 clock domain, preserve one observer mirror.\n\nWARNING: terminating all mirrors causes observer reassignment.\n\nAUTHORIZATION: 03-000\n\n[36% DATA LOSS]'},{id:'0x0003',pct:31,title:'Employee Termination 000',text:'[31% RECOVERED]\n\nSUBJECT: 000\nSTATUS: terminated / running / present\nDATE: 2001-07-14\n\n[record type mismatch: HR / PROCESS TABLE]'},{id:'0x714B',pct:47,title:'Incident 7/14 Dispatch',text:'[47% RECOVERED]\n\n02:14:01 subject observed at C03\n02:14:01 badge 000 accepted\n02:14:02 archive branch count: 2\n02:21:00 branch count: 1? 2? 3?'}];let chosen=null;const items=document.querySelector('#items'),frag=document.querySelector('#fragment'),view=document.querySelector('#view'),restore=document.querySelector('#restore');document.querySelector('#scan').onclick=()=>{LandiddleState.action('deleted-scan');items.innerHTML='';blocks.forEach(b=>{const el=document.createElement('button');el.className='recovery-item';el.innerHTML=`<b>${b.id}</b> ${b.title}<small>${b.pct}% recoverable</small>`;el.onclick=()=>{chosen=b;items.querySelectorAll('.recovery-item').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.querySelector('#fragLabel').textContent=`BLOCK ${b.id} // ${b.pct}%`;frag.textContent='Fragment selected. Use VIEW FRAGMENT.';view.disabled=restore.disabled=false};items.appendChild(el)})};view.onclick=()=>{if(chosen)frag.textContent=chosen.text};restore.onclick=()=>{if(!chosen)return;LandiddleState.recovery(chosen.id);landiddleAward('recovery');frag.textContent=chosen.text+'\n\nRESTORE STATUS: ATTACHED TO CURRENT SESSION';if(chosen.id==='0x17A9')LandiddleState.unlock('containment-protocol')};
</script></body></html>
